name: CI Pipeline (Node + Python)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  node-ci:
    name: Node App CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Node dependencies
        run: cd node-app && npm install

      - name: Run Node tests
        run: cd node-app && npm test

      - name: Build Node Docker image
        run: docker build -t node-app ./node-app


  python-ci:
    name: Python App CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install Python dependencies
        run: cd python-app && pip install -r requirements.txt

      - name: Build Python Docker image
        run: docker build -t python-app ./python-app

  deploy-node:
    runs-on: ubuntu-latest
    needs: [node-ci]
    steps:
      - name: Deploy Node App
        run: curl -X POST "$RENDER_NODE_HOOK"
        env:
          RENDER_NODE_HOOK: ${{ secrets.RENDER_NODE_HOOK }}

  deploy-python:
    runs-on: ubuntu-latest
    needs: [python-ci]
    steps:
      - name: Deploy Python App
        run: curl -X POST "$RENDER_PYTHON_HOOK"
        env:
          RENDER_PYTHON_HOOK: ${{ secrets.RENDER_PYTHON_HOOK }}
